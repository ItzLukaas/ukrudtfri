# Eksempel: self-hosted Umami til fx https://stats.ukrudtfri.dk (egen server / VPS).
# Vil du undgå Docker: deploy Umami i stedet som separat projekt på Vercel — se README.
# Kør: docker compose -f docker/umami.compose.yaml up -d
# Læg en reverse proxy (Caddy/Nginx/Traefik) foran med TLS og peg på port 3000.
#
# Første gang: åbn http://localhost:3000 (eller dit domæne), opret admin,
# tilføj website "ukrudtfri.dk", kopier Website ID til NEXT_PUBLIC_UMAMI_WEBSITE_ID i Vercel.

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@db:5432/umami
      DATABASE_TYPE: postgresql
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
